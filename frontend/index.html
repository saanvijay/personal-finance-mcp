<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Personal Finance</h1>
  </header>

  <main>
    <!-- Summary Cards -->
    <section class="summary">
      <div class="card balance">
        <span class="label">Balance</span>
        <span class="amount" id="balance">$0.00</span>
      </div>
      <div class="card income">
        <span class="label">Income</span>
        <span class="amount" id="total-income">$0.00</span>
      </div>
      <div class="card expense">
        <span class="label">Expenses</span>
        <span class="amount" id="total-expense">$0.00</span>
      </div>
    </section>

    <!-- Add Transaction Form -->
    <section class="form-section">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-row">
          <label>
            Type
            <select id="type">
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </label>
          <label>
            Amount
            <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required />
          </label>
        </div>
        <div class="form-row">
          <label>
            Category
            <select id="category"></select>
          </label>
          <label>
            Date
            <input type="date" id="date" required />
          </label>
        </div>
        <label>
          Note (optional)
          <input type="text" id="note" placeholder="Add a note..." maxlength="100" />
        </label>
        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <!-- Transaction List -->
    <section class="transactions-section">
      <h2>Transactions</h2>
      <ul id="transaction-list">
        <li class="empty-state">No transactions yet. Add one above!</li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
